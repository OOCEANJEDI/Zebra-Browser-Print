<!DOCTYPE html>
<html>
<head>
<script type="text/javascript" src="BrowserPrint-3.1.250.min.js"></script>
  <script type="text/javascript" src="BrowserPrint-Zebra-1.1.250.min.js"></script>
</head>
<body>
  <button id="printBtn" style="font-size:24px; padding:15px 30px;">Print Label</button>
  <div id="status"></div>

  <script>
    ZOHO.CREATOR.init().then(function() {
      ZOHO.CREATOR.UTIL.getQueryParams().then(function(params) {
        document.getElementById("printBtn").addEventListener("click", function() {
          var processId = params.Process_ID;
          var displayLabel = params.Display_label;
          var dateVal = params.Date;
          var qrData = processId;

          var zpl = "^XA\n^PW800\n^LL800\n\n"
            + "^FO40,20\n^A0N,30,30\n^FB720,1,0,R\n^FD" + dateVal + "\\&^FS\n\n"
            + "^FO40,90\n^A0N,60,60\n^FB720,1,0,C\n^FD" + processId + "\\&^FS\n\n"
            + "^FO40,170\n^A0N,40,40\n^FB720,3,0,C\n^FD" + displayLabel + "\\&^FS\n\n"
            + "^FO280,400\n^BQN,2,10\n^FDQA," + qrData + "\\&^FS\n\n^XZ";

          BrowserPrint.getDefaultDevice("printer", function(device) {
            device.send(zpl, function() {
              document.getElementById("status").innerText = "Label sent to printer.";
            }, function(error) {
              document.getElementById("status").innerText = "Print error: " + error;
            });
          }, function(error) {
            document.getElementById("status").innerText = "No printer found: " + error;
          });
        });
      });
    });
  </script>
</body>
</html>
